apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: download-go-modules
spec:
  params:
    - name: TEST_FRAMEWORK
      default: gauge
    - name: IMAGE
      default: registry.access.redhat.com/ubi9/go-toolset:latest
  workspaces:
    - name: release-tests-git
    - name: release-tests-ginkgo-git
    - name: gomod-cache
  steps:
    - name: download
      image: $(params.IMAGE)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        gomod_hash() {
          # Key on go.mod only — go.sum can appear or change after clone/go mod download.
          local repo="${1:-.}"
          [[ -f "$repo/go.mod" ]] || return 1
          sha256sum "$repo/go.mod" | sha256sum | awk '{print substr($1,1,12)}'
        }

        wait_repo_ready() {
          local repo=$1 last="" cur="" stable="" stable_count=0 i
          for i in $(seq 1 120); do
            [[ -f "$repo/go.mod" ]] || { echo "waiting for ${repo}/go.mod (${i}/120)..." >&2; sleep 2; continue; }
            if [[ ! -d "$repo/vendor" && ! -f "$repo/go.sum" ]]; then
              echo "waiting for ${repo}/go.sum (${i}/120)..." >&2
              sleep 2
              continue
            fi
            cur=$(gomod_hash "$repo") || continue
            if [[ -n "$last" && "$cur" == "$last" ]]; then
              stable_count=$((stable_count + 1))
              if [[ $stable_count -ge 3 ]]; then
                stable=$cur
                break
              fi
            else
              stable_count=1
              last=$cur
            fi
            echo "waiting for stable go.mod in ${repo} (${stable_count}/3, hash=${cur})..." >&2
            sleep 3
          done
          [[ -n "$stable" ]] || { echo "ERROR: ${repo}/go.mod not stable after clone" >&2; exit 1; }
          printf '%s' "$stable"
        }

        populate_cache() {
          local repo=$1 key=$2 fw=$3 lock="${GOMODCACHE_ROOT}/.lock"
          local gomod="${GOMODCACHE_ROOT}/${key}/gomod"
          local tools="${GOMODCACHE_ROOT}/${key}/tools/bin"
          mkdir -p "$gomod" "$tools"

          (
            flock -w 900 9 || { echo "ERROR: gomod lock timeout"; exit 1; }
            if [[ -f "${gomod}/.ready" && -f "${tools}/.ready" ]]; then
              echo "cache ready: gomod=${gomod} tools=${tools}"
              return 0
            fi

            if [[ -d "$repo/vendor" ]]; then
              echo "Using vendored dependencies in ${repo}"
            else
              echo "go mod download → ${gomod}"
              (cd "$repo" && GOMODCACHE="$gomod" go mod download)
              echo "go build ./... (warm compile deps)"
              (cd "$repo" && GOMODCACHE="$gomod" go build -mod=readonly ./...) \
                || echo "WARN: go build ./... failed; go mod download cache is still usable"
            fi
            touch "${gomod}/.ready"

            case "$fw" in
              ginkgo)
                if [[ ! -x "${tools}/ginkgo" ]]; then
                  echo "go install ginkgo → ${tools}"
                  (cd "$repo" && GOMODCACHE="$gomod" GOBIN="$tools" \
                    go install github.com/onsi/ginkgo/v2/ginkgo)
                fi
                ;;
              *)
                if [[ ! -x "${tools}/gauge" ]]; then
                  echo "go install gauge → ${tools}"
                  GOMODCACHE="$gomod" GOBIN="$tools" go install github.com/getgauge/gauge@v1.6.25
                fi
                local gauge_home="${GOMODCACHE_ROOT}/${key}/gauge-home"
                if [[ ! -f "${gauge_home}/.ready" ]]; then
                  mkdir -p "$gauge_home"
                  export GAUGE_HOME="$gauge_home" PATH="${tools}:${PATH}"
                  gauge install go 2>&1 || true
                  gauge install html-report && gauge install xml-report -v 0.5.3
                  gauge config check_updates false
                  gauge config runner_connection_timeout 900000
                  gauge config runner_request_timeout 600000
                  touch "${gauge_home}/.ready"
                fi
                ;;
            esac
            touch "${tools}/.ready"
          ) 9>"$lock"
        }

        GOMODCACHE_ROOT="$(workspaces.gomod-cache.path)"
        mkdir -p "$GOMODCACHE_ROOT"
        fw="$(printf '%s' "$(params.TEST_FRAMEWORK)" | tr '[:upper:]' '[:lower:]')"

        case "$fw" in
          ginkgo)
            repo="$(workspaces.release-tests-ginkgo-git.path)"
            [[ -f "${repo}/go.mod" ]] || { echo "ERROR: ginkgo go.mod missing in ${repo}"; exit 1; }
            ;;
          *)
            fw=gauge
            repo="$(workspaces.release-tests-git.path)"
            [[ -f "${repo}/go.mod" ]] || { echo "ERROR: gauge go.mod missing in ${repo}"; exit 1; }
            ;;
        esac

        key=$(wait_repo_ready "$repo")
        [[ "$key" =~ ^[a-f0-9]{12}$ ]] || { echo "ERROR: invalid gomod cache key: ${key}" >&2; exit 1; }
        echo "framework=${fw} repo=${repo} gomod-hash=${key}"

        rm -f "${GOMODCACHE_ROOT}/.${fw}.cache-key" "${GOMODCACHE_ROOT}/.${fw}.cache-ready"
        populate_cache "$repo" "$key" "$fw"

        final=$(gomod_hash "$repo")
        if [[ "$final" != "$key" ]]; then
          echo "WARN: go.mod hash changed during populate (${key} -> ${final}); repopulating"
          key=$final
          populate_cache "$repo" "$key" "$fw"
        fi

        printf '%s' "$key" > "${GOMODCACHE_ROOT}/.${fw}.cache-key"
        touch "${GOMODCACHE_ROOT}/.${fw}.cache-ready"
        echo "Shared cache populated for all test TaskRuns: ${GOMODCACHE_ROOT}/${key}/"
