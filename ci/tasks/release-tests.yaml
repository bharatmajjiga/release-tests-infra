apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: release-tests
spec:
  workspaces:
    - name: release-tests-git
    - name: results
  params:
  - name: ARCH
    description: cluster architecture
    default: "linux/amd64"
  - name: CATALOG_SOURCE
    description: Provide catalog-source name through which user have to subscribe operator
    default: redhat-operators
  - name: CHAINS_REPOSITORY
    default: "quay.io/openshift-pipeline/chainstest"
    description: the url of the repository where the test image will be pushed
  - name: CHANNEL
    description: Place-holder to provide subscription CHANNEL
    default: stable
  - name: CLUSTER_NAME
    description: Cluster name
  - name: FAIL_ON_ERROR
    default: "false"
  - name: IMAGE
    description: release-tests image
    default: quay.io/openshift-pipeline/ci
  - name: IS_DISCONNECTED
    description: flag to decide if provisioned cluster is disconnected
    default: "false"
  - name: JIB_MAVEN_REPOSITORY
    default: "quay.io/openshift-pipeline/jib-maven"
  - name: OSP_VERSION
    description: "Full bugfix version of Openshift Pipelines"
    default: ""
  - name: RUN_AS
    description: Provide user privilege to runs tests with  (eg one of admin/non-admin)
    default: "non-admin"
  - name: SPECS
    description: Run tests only from that specific directory
  - name: TAGS
    description: Tags defines the nature of test cases you want to execute. (eg "e2e,integration")
    default: "e2e,non-admin"
  steps:
    - name: run
      image: $(params.IMAGE)
      workingDir: $(workspaces.release-tests-git.path)
      envFrom:
        - secretRef:
            name: cluster-creds
            optional: true
      env:
        - name: ADMIN_NAME
          valueFrom:
            secretKeyRef:
              key: admin-name
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: kubeadmin-password
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              key: admin-token
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
        - name: APISERVER
          valueFrom:
            secretKeyRef:
              key: api-url
              name: cluster-$(params.CLUSTER_NAME)
        - name: USER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: user-password
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
      script: |
        #!/usr/bin/env bash
        set -e -u -o pipefail

        # Install oc and gauge if not present
        TOOLS_BIN=$HOME/bin; mkdir -p "$TOOLS_BIN"; export PATH="$TOOLS_BIN:$PATH"

        if ! command -v oc &>/dev/null; then
          OC_ARCH=$(uname -m); [[ "$OC_ARCH" == "aarch64" ]] && OC_ARCH="arm64"
          OCP_VER=$(curl -sk -H "Authorization: Bearer ${ADMIN_TOKEN:-}" \
            "${APISERVER}/apis/config.openshift.io/v1/clusterversions/version" \
            | sed -n 's/.*"version":[[:space:]]*"\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' | head -1) || true
          echo "Installing oc CLI ${OCP_VER:-stable} (${OC_ARCH})..."
          curl -sSfL "https://mirror.openshift.com/pub/openshift-v4/${OC_ARCH}/clients/ocp/${OCP_VER:-stable}/openshift-client-linux.tar.gz" | tar xz -C "$TOOLS_BIN" oc kubectl
        fi
        if ! command -v gauge &>/dev/null; then
          echo "Installing gauge..."
          GOBIN="$TOOLS_BIN" go install github.com/getgauge/gauge@latest
        fi

        export GOPATH=$(mktemp -d)/go
        export GOMODCACHE=${GOMODCACHE:-$GOPATH/pkg/mod}
        export GOCACHE=$(mktemp -d)/go-build
        export ADMIN_NAME=${ADMIN_NAME:-kubeadmin}
        export USER_PASSWORD=${USER_PASSWORD:-user}
        export KUBECONFIG=$HOME/.kube/config
        export CHAINS_REPOSITORY=$(params.CHAINS_REPOSITORY)
        export JIB_MAVEN_REPOSITORY=$(params.JIB_MAVEN_REPOSITORY)

        taskRunName=$(oc get taskrun $(context.taskRun.name) -n $(context.taskRun.namespace) -o jsonpath='{.metadata.labels.tekton\.dev/pipelineTask}')
        status=fail

        report_path=$(mktemp -d)

        if [[ $(echo $(params.RUN_AS) | tr -s  '[:upper:]'  '[:lower:]') == admin ]]; then
            if [[ -n "${ADMIN_TOKEN:-}" ]]; then
              echo -e "Logging in to cluster $(params.CLUSTER_NAME) with admin token"
              oc login --token=$ADMIN_TOKEN $APISERVER --insecure-skip-tls-verify=true
            else
              echo -e "Logging in to cluster $(params.CLUSTER_NAME) as user '$ADMIN_NAME'"
              oc login -u $ADMIN_NAME -p $ADMIN_PASSWORD $APISERVER --insecure-skip-tls-verify=true
            fi
        else
            echo -e "Logging in to cluster $(params.CLUSTER_NAME) as user 'user'"
            oc login -u user -p $USER_PASSWORD $APISERVER --insecure-skip-tls-verify=true
        fi

        if [[ -n "$(params.OSP_VERSION)" ]]; then
          export OSP_VERSION="$(params.OSP_VERSION)"
        fi

        clean() {
          echo "Updating status of test result as $status"
          echo "${taskRunName}: ${status}" > $(workspaces.results.path)/${taskRunName}.result

          if [[ -f ${report_path}/xml-report/result.xml ]]; then
            cp ${report_path}/xml-report/result.xml $(workspaces.results.path)/${taskRunName}.xml
          fi
          cp ${report_path}/gauge.log $(workspaces.results.path)/${taskRunName}.log
        }
        trap clean EXIT

        go mod download
        gauge install go 2>&1 || true

        # Pre-compile test code so gauge-go runner can start quickly
        echo "Pre-compiling test code..."
        go build ./...

        if [[ "$(params.TAGS)" == "install" ]] || [[ "$(params.TAGS)" == "uninstall" ]] || [[ "$(params.TAGS)" == "upgrade" ]] ; then
           gauge_reports_dir=${report_path} logs_directory=${report_path} CATALOG_SOURCE=$(params.CATALOG_SOURCE) CHANNEL=$(params.CHANNEL) IS_DISCONNECTED=$(params.IS_DISCONNECTED) gauge run --tags="$(params.TAGS)" --log-level=debug --verbose $(params.SPECS)
           status=pass
        else
           gauge_reports_dir=${report_path} logs_directory=${report_path} ARCH=$(params.ARCH) gauge run --tags="$(params.TAGS)" --max-retries-count=3 --retry-only "$(params.TAGS)" --log-level=debug --verbose $(params.SPECS)
           status=pass
        fi
