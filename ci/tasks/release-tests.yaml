apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: release-tests
spec:
  workspaces:
    - name: release-tests-git
    - name: release-tests-ginkgo-git
    - name: gomod-cache
    - name: results
  params:
  - name: ARCH
    default: "linux/amd64"
  - name: CATALOG_SOURCE
    default: redhat-operators
  - name: CHAINS_REPOSITORY
    default: "quay.io/openshift-pipeline/chainstest"
  - name: CHANNEL
    default: stable
  - name: CHANNEL_VERSION
    description: "x.y.z hint used to derive pipelines-<x.y> when CHANNEL is empty (e.g. OSP_VERSION=latest installs). Ignored when CHANNEL is set."
    default: ""
  - name: CLUSTER_NAME
  - name: FAIL_ON_ERROR
    default: "false"
  - name: IMAGE
    default: quay.io/openshift-pipeline/ci:latest
  - name: IS_DISCONNECTED
    default: "false"
  - name: JIB_MAVEN_REPOSITORY
    default: "quay.io/openshift-pipeline/jib-maven"
  - name: OPERATOR_ENVIRONMENT
    description: "Operator environment (pre-stage, stage, prod) — controls which catalog is used for OLM skipRange validation"
    default: ""
  - name: OSP_VERSION
    default: ""
  - name: RUN_AS
    default: "non-admin"
  - name: SPECS
    description: Gauge spec path (specs/*.spec) or Ginkgo test path (tests/*/)
  - name: TAGS
    default: "e2e,non-admin"
  - name: TKN_DOWNLOAD_URL
    default: ""
  - name: TEST_FRAMEWORK
    description: gauge (release-tests) or ginkgo (release-tests-ginkgo)
    default: gauge
  - name: GIT_RELEASE_TESTS_BRANCH
    description: Gauge repo branch (cache key when TEST_FRAMEWORK=gauge)
    default: ""
  - name: GIT_RELEASE_TESTS_GINKGO_BRANCH
    description: Ginkgo repo branch (cache key when TEST_FRAMEWORK=ginkgo)
    default: ""
  steps:
    - name: run
      image: $(params.IMAGE)
      workingDir: $(workspaces.release-tests-git.path)
      env:
        - name: PAC_GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: pac-github-token
              key: pac-github-token
              optional: true
        - name: PAC_GITHUB_ORG
          valueFrom:
            secretKeyRef:
              name: pac-github-token
              key: pac-github-org
              optional: true
        - name: PAC_GITHUB_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: pac-github-token
              key: pac-github-webhook-token
              optional: true
        - name: GITLAB_TOKEN
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-token
              optional: true
        - name: GITLAB_GROUP_NAMESPACE
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-group-ns
              optional: true
        - name: GITLAB_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-project-id
              optional: true
        - name: GITLAB_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-webhook-token
              optional: true
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github
              key: github-token
              optional: true
        - name: CHAINS_DOCKER_CONFIG_JSON
          valueFrom:
            secretKeyRef:
              name: quay-io-dockerconfig
              key: config.json
              optional: true
        - name: ADMIN_NAME
          valueFrom:
            secretKeyRef:
              key: admin-name
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: kubeadmin-password
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              key: admin-token
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
        - name: APISERVER
          valueFrom:
            secretKeyRef:
              key: api-url
              name: cluster-$(params.CLUSTER_NAME)
        - name: USER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: user-password
              name: cluster-$(params.CLUSTER_NAME)
              optional: true
        - name: TASKRUN_NAME
          value: $(context.taskRun.name)
        - name: TASKRUN_NAMESPACE
          value: $(context.taskRun.namespace)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # --- helpers ---
        pod_arch() {
          case "$(uname -m)" in aarch64) echo arm64 ;; x86_64) echo amd64 ;; *) uname -m ;; esac
        }

        # release-tests-ginkgo S2I tests start PipelineRuns before the operator creates the pipeline SA.
        prepare_ginkgo_ecosystem_s2i() {
          local specs="$1"
          [[ "$specs" != *ecosystem-s2i* ]] && return 0
          local eco="pkg/pipelines/ecosystem.go" s2i="tests/ecosystem/ecosystem_s2i_test.go"
          if [[ -f "$eco" ]] && ! grep -q 'WaitForServiceAccount(cs, namespace, "pipeline")' "$eco"; then
            echo "Patching ${eco}: wait for pipeline ServiceAccount before concurrent S2I PipelineRuns"
            if ! grep -q 'release-tests-ginkgo/pkg/k8s' "$eco"; then
              awk '/github.com\/openshift-pipelines\/release-tests-ginkgo\/pkg\/config/ && !done_imp {
                print; print "\t\"github.com/openshift-pipelines/release-tests-ginkgo/pkg/k8s\""; done_imp=1; next
              } { print }' "$eco" > "${eco}.tmp" && mv "${eco}.tmp" "$eco"
            fi
            awk '/^\tworkspaces := map\[string\]string/ && !done_wait {
              print "\tk8s.WaitForServiceAccount(cs, namespace, \"pipeline\")"; done_wait=1
            } { print }' "$eco" > "${eco}.tmp" && mv "${eco}.tmp" "$eco"
          fi
          if [[ -f "$s2i" ]] && ! grep -q 'WaitForServiceAccount(sharedClients, ns, "pipeline")' "$s2i"; then
            echo "Patching ${s2i}: wait for pipeline ServiceAccount before S2I test resources"
            if ! grep -q 'release-tests-ginkgo/pkg/k8s' "$s2i"; then
              awk '/github.com\/openshift-pipelines\/release-tests-ginkgo\/pkg\/config/ && !done_imp {
                print; print "\t\"github.com/openshift-pipelines/release-tests-ginkgo/pkg/k8s\""; done_imp=1; next
              } { print }' "$s2i" > "${s2i}.tmp" && mv "${s2i}.tmp" "$s2i"
            fi
            awk '/sharedClients\.NewClientSet\(ns\)/ {
              print; print "\t\tk8s.WaitForServiceAccount(sharedClients, ns, \"pipeline\")"; next
            } { print }' "$s2i" > "${s2i}.tmp" && mv "${s2i}.tmp" "$s2i"
          fi
        }

        cleanup_stale_s2i_namespaces() {
          local specs="$1"
          [[ "$specs" != *ecosystem-s2i* ]] && return 0
          local projects deleted=0
          projects=$(oc get projects -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
            | grep -E '^eco-s2i-' || true)
          [[ -n "$projects" ]] || return 0
          echo "Cleaning stale eco-s2i-* namespaces from prior runs"
          while IFS= read -r ns; do
            [[ -n "$ns" ]] || continue
            oc delete project "$ns" --wait=false >/dev/null 2>&1 && deleted=$((deleted + 1)) || true
          done <<< "$projects"
          echo "Requested deletion of ${deleted} stale namespace(s)"
        }

        resolve_tkn_url() {
          local url="${1:-}"
          if [[ -n "$url" ]]; then
            url="${url/developers.qa.redhat.com/developers.redhat.com}"
            echo "$url" | sed -E \
              "s|/content-gateway/rest/browse/pub/cgw/pipelines/([^/]+)/?.*|/content-gateway/file/pub/cgw/pipelines/\1/tkn-linux-${CLI_ARCH}.tar.gz|" \
              | sed -E "s/tkn-linux-[a-z0-9]+\.tar\.gz/tkn-linux-${CLI_ARCH}.tar.gz/"
            return
          fi

          local cluster_url=""
          if [[ -n "${ADMIN_TOKEN:-}" ]]; then
            cluster_url=$(curl -sk -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              "${APISERVER}/apis/console.openshift.io/v1/consoleclidownloads/tkn" 2>/dev/null \
              | grep -o "https://[^\"]*tkn-linux-${CLI_ARCH}\\.tar\\.gz" | head -1) || true
          fi
          if [[ -z "$cluster_url" && -n "${ADMIN_TOKEN:-}" ]]; then
            local tkn_host
            tkn_host=$(curl -sk -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              "${APISERVER}/apis/route.openshift.io/v1/namespaces/openshift-pipelines/routes/tkn-cli-serve" 2>/dev/null \
              | grep -o '"host":"[^"]*"' | head -1 | cut -d'"' -f4) || true
            [[ -n "$tkn_host" ]] && cluster_url="https://${tkn_host}/tkn/tkn-linux-${CLI_ARCH}.tar.gz"
          fi

          # oc-based fallback: this task authenticates via `oc login` (ADMIN_TOKEN is
          # often empty when logging in with kubeadmin), so query the cluster with oc.
          if [[ -z "$cluster_url" ]] && command -v oc >/dev/null 2>&1; then
            cluster_url=$(oc get consoleclidownloads.console.openshift.io tkn \
              -o jsonpath='{.spec.links[*].href}' 2>/dev/null \
              | tr ' ' '\n' | grep -m1 "tkn-linux-${CLI_ARCH}\.tar\.gz") || true
            if [[ -z "$cluster_url" ]]; then
              local oc_tkn_host
              oc_tkn_host=$(oc get route tkn-cli-serve -n openshift-pipelines \
                -o jsonpath='{.spec.host}' 2>/dev/null) || true
              [[ -n "$oc_tkn_host" ]] && cluster_url="https://${oc_tkn_host}/tkn/tkn-linux-${CLI_ARCH}.tar.gz"
            fi
          fi

          if [[ -n "$cluster_url" ]]; then
            echo "$cluster_url"
          else
            echo "ERROR: Cannot resolve tkn download URL from cluster — set TKN_DOWNLOAD_URL in .env" >&2
            return 1
          fi
        }

        gomod_hash() {
          local repo="${1:-.}"
          [[ -f "$repo/go.mod" ]] || return 1
          sha256sum "$repo/go.mod" | sha256sum | awk '{print substr($1,1,12)}'
        }

        install_oc() {
          local url="" is_tar=false
          url=$(curl -sk -H "Authorization: Bearer ${ADMIN_TOKEN:-}" \
            "${APISERVER}/apis/console.openshift.io/v1/consoleclidownloads/oc-cli-downloads" 2>/dev/null \
            | sed -n "s|.*\"href\":[[:space:]]*\"\\([^\"]*/${CLI_ARCH}/linux/oc\\.tar\\)\".*|\\1|p" | head -1) || true
          if [[ -n "$url" ]]; then
            is_tar=true
          else
            local ver
            ver=$(curl -sk -H "Authorization: Bearer ${ADMIN_TOKEN:-}" \
              "${APISERVER}/apis/config.openshift.io/v1/clusterversions/version" \
              | sed -n 's/.*"version":[[:space:]]*"\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' | head -1) || true
            url="https://mirror.openshift.com/pub/openshift-v4/${CLI_ARCH}/clients/ocp/${ver:-stable}/openshift-client-linux.tar.gz"
          fi
          echo "Installing oc (${CLI_ARCH}) from ${url}..."
          if [[ "$is_tar" == true ]]; then
            curl -ksSfL "$url" | tar xf - -C "$TOOLS_BIN" oc kubectl
          else
            curl -ksSfL "$url" | tar xzf - -C "$TOOLS_BIN" oc kubectl
          fi
        }

        install_tkn() {
          local url archive tmp jar tags="$(params.TAGS)"
          url=$(resolve_tkn_url "$(params.TKN_DOWNLOAD_URL)")
          archive="/tmp/tkn-linux-${CLI_ARCH}.tar.gz"
          # Force fresh download after operator upgrade to get the new version
          if [[ "$tags" == "upgrade" || "$tags" == "post-upgrade" ]]; then
            rm -f "$archive"
          fi
          if [[ ! -s "$archive" ]]; then
            echo "Downloading tkn/opc from ${url}..."
            tmp="${archive}.part.$$"; jar=$(mktemp)
            curl -kfsSL -c "$jar" -b "$jar" "$url" -o "$tmp" && rm -f "$jar" && mv "$tmp" "$archive"
          fi
          tar xzf "$archive" -C "$TOOLS_BIN" --strip-components=1
          echo "  tkn version: $(${TOOLS_BIN}/tkn version 2>/dev/null | head -1 || echo unknown)"
          echo "  opc version: $(${TOOLS_BIN}/opc version 2>/dev/null | head -1 || echo unknown)"
        }

        refresh_cli_from_upgraded_cluster() {
          local expected="${1:-}"
          local url archive tmp jar t want served deadline matched=false
          want="${expected%.*}"   # target minor, e.g. 1.24
          url=$(resolve_tkn_url "$(params.TKN_DOWNLOAD_URL)")
          archive="/tmp/tkn-linux-${CLI_ARCH}.tar.gz"
          echo "Waiting for tkn-cli-serve to serve the upgraded CLI (want ${want:-any}.x) from ${url}"
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            # Wait for the operator's re-roll of tkn-cli-serve to complete.
            oc rollout status deployment/tkn-cli-serve -n openshift-pipelines --timeout=120s 2>/dev/null || true
            rm -f "$archive"
            tmp="${archive}.part.$$"; jar=$(mktemp)
            if curl -kfsSL -c "$jar" -b "$jar" "$url" -o "$tmp" 2>/dev/null; then
              rm -f "$jar"; mv "$tmp" "$archive"
              tar xzf "$archive" -C "$TOOLS_BIN" --strip-components=1 2>/dev/null || true
              hash -r
              served=$(${TOOLS_BIN}/opc version 2>/dev/null | sed -n 's/.*Client:[[:space:]]*//p' | head -1)
              if [[ -z "$want" || "$served" == "${want}."* || "$served" == "$want" ]]; then
                echo "Operator upgraded — tkn-cli-serve serving opc ${served:-unknown}"
                matched=true
                break
              fi
              echo "  tkn-cli-serve still serving opc ${served:-unknown} (want ${want}.x); retrying..."
            else
              rm -f "$jar" "$tmp"
              echo "  tkn-cli-serve route not ready yet; retrying..."
            fi
            sleep 10
          done
          [[ "$matched" == true ]] \
            || echo "WARN: tkn-cli-serve did not serve ${want:-target}.x within timeout; using opc ${served:-unknown}"
          echo "  tkn version: $(${TOOLS_BIN}/tkn version 2>/dev/null | head -1 || echo unknown)"
          echo "  opc version: $(${TOOLS_BIN}/opc version 2>/dev/null | head -1 || echo unknown)"

          # Refresh the shared cache so consecutive tasks (e2e, versions, ...) that
          # read CACHED_TOOLS_BIN also get the upgraded CLI, not the pre-upgrade one.
          if [[ -n "${CACHED_TOOLS_BIN:-}" && -d "$CACHED_TOOLS_BIN" ]]; then
            local lock="${GOMODCACHE_ROOT}/.lock"
            (
              flock -w 300 9 || { echo "WARN: cache lock timeout; skipped shared CLI refresh"; exit 0; }
              for t in tkn opc; do
                [[ -x "${TOOLS_BIN}/${t}" ]] && cp -f "${TOOLS_BIN}/${t}" "${CACHED_TOOLS_BIN}/${t}"
              done
              echo "Refreshed shared cached tkn/opc for consecutive tasks: ${CACHED_TOOLS_BIN}"
            ) 9>"$lock"
          fi
        }

        ensure_gauge() {
          command -v gauge >/dev/null && return
          [[ -x "$TOOLS_BIN/gauge" ]] && return
          GOBIN="$TOOLS_BIN" go install github.com/getgauge/gauge@v1.6.25
          gauge install go 2>&1 || true
          gauge install html-report && gauge install xml-report -v 0.5.3
          gauge config check_updates false
          gauge config runner_connection_timeout 900000
          gauge config runner_request_timeout 600000
        }

        ensure_ginkgo() {
          command -v ginkgo >/dev/null && return
          [[ -x "$TOOLS_BIN/ginkgo" ]] && return
          GOBIN="$TOOLS_BIN" go install github.com/onsi/ginkgo/v2/ginkgo
        }

        ensure_toolchain() {
          local tags="$(params.TAGS)"
          [[ -x "${CACHED_TOOLS_BIN:-}/oc" || -x "$TOOLS_BIN/oc" ]] || install_oc

          # upgrade/post-upgrade: tkn/opc come from tkn-cli-serve *after* CSV is Succeeded.
          # Using the PVC cache here serves the pre-upgrade (e.g. 1.23.1) binaries.
          if [[ "$tags" != upgrade && "$tags" != post-upgrade ]]; then
            [[ (-x "${CACHED_TOOLS_BIN:-}/tkn" && -x "${CACHED_TOOLS_BIN:-}/opc") || (-x "$TOOLS_BIN/tkn" && -x "$TOOLS_BIN/opc") ]] || install_tkn
          fi

          case "$FRAMEWORK" in
            gauge)  ensure_gauge ;;
            ginkgo) ensure_ginkgo ;;
          esac
        }

        use_gomod_cache() {
          local computed cache_id key tools gauge_home
          local key_file="${GOMODCACHE_ROOT}/.${FRAMEWORK}.cache-key"
          local ready_file="${GOMODCACHE_ROOT}/.${FRAMEWORK}.cache-ready"

          local deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            [[ -f "$ready_file" && -f "$key_file" ]] && break
            echo "waiting for go-mod-cache to finish..."
            sleep 5
          done
          [[ -f "$key_file" && -f "$ready_file" ]] \
            || { echo "ERROR: shared cache not ready (missing ${key_file} or ${ready_file})"; exit 1; }

          cache_id=$(tr -d '[:space:]' < "$key_file")
          key="${GOMODCACHE_ROOT}/${cache_id}/gomod"
          tools="${GOMODCACHE_ROOT}/${cache_id}/tools-${CLI_ARCH}/bin"
          gauge_home="${GOMODCACHE_ROOT}/${cache_id}/gauge-home-${CLI_ARCH}"

          [[ -f "${tools}/.ready" ]] \
            || { echo "ERROR: tools cache not ready at ${tools}"; exit 1; }

          export GOMODCACHE="$key" CACHED_TOOLS_BIN="$tools"
          export GOPATH="$(mktemp -d)"

          if [[ -d vendor ]]; then
            echo "Using vendored dependencies in $(pwd)"
          else
            [[ -f "${key}/.ready" ]] \
              || { echo "ERROR: gomod cache not ready at ${key}"; exit 1; }
            echo "Using cached go modules: ${GOMODCACHE} (hash=${cache_id})"
          fi

          if [[ "$FRAMEWORK" == gauge && -f "${gauge_home}/.ready" ]]; then
            export GAUGE_HOME="$gauge_home"
          fi
          echo "Using cached tools: ${CACHED_TOOLS_BIN}"
        }

        prepare_toolchain() {
          TOOLS_BIN="$(mktemp -d)/bin"
          local cache_id
          cache_id=$(tr -d '[:space:]' < "${GOMODCACHE_ROOT}/.${FRAMEWORK}.cache-key" 2>/dev/null) || true
          if [[ -n "$cache_id" && -d "${GOMODCACHE_ROOT}/${cache_id}/gobuild-${CLI_ARCH}" ]]; then
            GOCACHE="${GOMODCACHE_ROOT}/${cache_id}/gobuild-${CLI_ARCH}"
          else
            GOCACHE="$(mktemp -d)"
          fi
          mkdir -p "$TOOLS_BIN"
          export GOCACHE
          local tags="$(params.TAGS)"
          # Ephemeral TOOLS_BIN first so refreshed tkn/opc beat go-mod-cache's pre-upgrade copies.
          if [[ "$tags" == upgrade || "$tags" == post-upgrade ]]; then
            if [[ -n "${CACHED_TOOLS_BIN:-}" && -d "$CACHED_TOOLS_BIN" ]]; then
              export PATH="${TOOLS_BIN}:${CACHED_TOOLS_BIN}:${PATH}"
            else
              export PATH="${TOOLS_BIN}:${PATH}"
            fi
          elif [[ -n "${CACHED_TOOLS_BIN:-}" && -d "$CACHED_TOOLS_BIN" ]]; then
            export PATH="${CACHED_TOOLS_BIN}:${TOOLS_BIN}:${PATH}"
          else
            export PATH="${TOOLS_BIN}:${PATH}"
          fi
          if [[ "$FRAMEWORK" == gauge && -z "${GAUGE_HOME:-}" ]]; then
            GAUGE_HOME="$(mktemp -d)"
            export GAUGE_HOME
          fi
          ensure_toolchain
        }

        ginkgo_test_path() {
          local spec="$(params.SPECS)"
          case "$spec" in
            tests/*)              echo "$spec" ;;
            specs/olm*)           echo tests/olm/ ;;
            specs/versions*)      echo tests/versions/ ;;
            specs/pac/*|specs/pac*) echo tests/pac/ ;;
            specs/pipelines*)     echo tests/pipelines/ ;;
            specs/triggers*)      echo tests/triggers/ ;;
            specs/chains*)        echo tests/chains/ ;;
            specs/results*)       echo tests/results/ ;;
            specs/operator*)      echo tests/operator/ ;;
            specs/ecosystem*)     echo tests/ecosystem/ ;;
            specs/metrics*)       echo tests/metrics/ ;;
            specs/manualapprovalgate*) echo tests/mag/ ;;
            specs/rbac*)          echo tests/operator/ ;;
            specs/addon*)          echo tests/operator/ ;;
            *)                    echo tests/... ;;
          esac
        }

        ginkgo_label_filter() {
          local tags="$1"
          case "$tags" in
            install|uninstall|upgrade) echo "$tags"; return ;;
            e2e) tags='e2e' ;;
            *)
              # gauge-style "a,b" or "a & b" → ginkgo label syntax; slashes break ginkgo labels (linux/amd64)
              tags=$(echo "$tags" | sed 's/[[:space:]]*&[[:space:]]*/ \&\& /g; s/,/ \&\& /g; s|/|_|g')
              ;;
          esac

          # Inject suite-specific label for operator sub-suites that share tests/operator/
          case "$(params.SPECS)" in
            specs/operator/rbac.spec|specs/rbac*)       tags="${tags} && rbac" ;;
            specs/operator/addon.spec|specs/addon*)     tags="${tags} && addon" ;;
            specs/operator/auto-prune.spec)             tags="${tags} && auto-prune" ;;
            specs/operator/tekton-pruner.spec)          tags="${tags} && tekton-pruner" ;;
          esac

          # Exclude disconnected-only tests on connected clusters
          if [[ "$(params.IS_DISCONNECTED)" != "true" ]]; then
            tags="${tags} && !disconnected"
          fi

          echo "$tags"
        }

        require_tools() {
          local t skip_cli="${1:-}"
          for t in oc; do
            command -v "$t" >/dev/null || { echo "ERROR: ${t} missing"; exit 1; }
          done
          if [[ "$skip_cli" != skip-cli ]]; then
            for t in tkn opc; do
              command -v "$t" >/dev/null || { echo "ERROR: ${t} missing"; exit 1; }
            done
          fi
          case "$FRAMEWORK" in
            gauge)  command -v gauge >/dev/null || { echo "ERROR: gauge missing"; exit 1; } ;;
            ginkgo) command -v ginkgo >/dev/null || { echo "ERROR: ginkgo missing"; exit 1; } ;;
          esac
        }

        login_cluster() {
          local run_as="${1,,}" rc=0
          if [[ "$run_as" == admin ]]; then
            if [[ -n "${ADMIN_PASSWORD:-}" ]]; then
              oc login -u "$ADMIN_NAME" -p "$ADMIN_PASSWORD" "$APISERVER" --insecure-skip-tls-verify=true >/dev/null 2>&1 || rc=$?
            elif [[ -n "${ADMIN_TOKEN:-}" ]]; then
              oc login --token="$ADMIN_TOKEN" "$APISERVER" --insecure-skip-tls-verify=true >/dev/null 2>&1 || rc=$?
            else
              echo "ERROR: no admin credentials in cluster secret"; return 1
            fi
          else
            oc login -u user -p "$USER_PASSWORD" "$APISERVER" --insecure-skip-tls-verify=true >/dev/null 2>&1 || rc=$?
          fi
          if [[ $rc -ne 0 ]]; then
            echo "ERROR: oc login failed (exit $rc) for ${run_as} on ${APISERVER}"
            return $rc
          fi
          echo "Logged in as $(oc whoami) on $(oc whoami --show-server)"
        }

        pin_subscription_template() {
          local ver="$1"
          local tmpl="template/subscription.yaml.tmp"
          local csv="openshift-pipelines-operator-rh.v${ver}"
          [[ -f "$tmpl" ]] || { echo "WARN: ${tmpl} missing, cannot pin startingCSV"; return 0; }
          echo "Pinning OLM subscription startingCSV=${csv} (Manual approval)"
          grep -q 'installPlanApproval: Automatic' "$tmpl" \
            && sed -i 's/installPlanApproval: Automatic/installPlanApproval: Manual/' "$tmpl"
          if grep -q 'startingCSV:' "$tmpl"; then
            sed -i "s#startingCSV:.*#startingCSV: ${csv}#" "$tmpl"
          else
            sed -i "/installPlanApproval: Manual/a\\  startingCSV: ${csv}" "$tmpl"
          fi
        }

        # Strip any pinned startingCSV from the ginkgo OLM template so the operator
        # installs the head of the channel (latest z-stream) instead of a fixed CSV.
        unpin_subscription_template() {
          local tmpl="template/subscription.yaml.tmp"
          [[ -f "$tmpl" ]] || { echo "WARN: ${tmpl} missing, cannot unpin startingCSV"; return 0; }
          echo "Unpinning startingCSV in ${tmpl} (install latest on channel)"
          grep -q 'installPlanApproval: Automatic' "$tmpl" \
            && sed -i 's/installPlanApproval: Automatic/installPlanApproval: Manual/' "$tmpl"
          sed -i '/^[[:space:]]*startingCSV:/d' "$tmpl"
        }

        # Read the version of the currently installed pipelines operator from the
        # live cluster (e.g. "1.23.3" from openshift-pipelines-operator-rh.v1.23.3).
        resolve_installed_osp_version() {
          local csv
          csv=$(oc get subscription openshift-pipelines-operator-rh -n openshift-operators \
            -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
          [[ -n "$csv" ]] || csv=$(oc get subscription openshift-pipelines-operator-rh -n openshift-operators \
            -o jsonpath='{.status.currentCSV}' 2>/dev/null || true)
          printf '%s' "${csv#openshift-pipelines-operator-rh.v}"
        }

        # Unpinned approval loop: approve any Manual InstallPlan for the pipelines
        # operator and wait until the subscription's installedCSV reaches Succeeded,
        # regardless of the exact z-stream (channel head).
        approve_latest_installplan() {
          local deadline=$((SECONDS + 900))
          local ip names phase approved installed
          echo "Waiting for latest CSV on channel (approving Manual InstallPlans)..."
          while (( SECONDS < deadline )); do
            installed=$(oc get subscription openshift-pipelines-operator-rh -n openshift-operators \
              -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
            if [[ -n "$installed" ]]; then
              phase=$(oc get csv "$installed" -n openshift-operators -o jsonpath='{.status.phase}' 2>/dev/null || true)
              if [[ "$phase" == Succeeded ]]; then
                echo "Installed ${installed} (phase=Succeeded)"
                return 0
              fi
            fi
            while IFS= read -r ip; do
              [[ -n "$ip" ]] || continue
              names=$(oc get installplan "$ip" -n openshift-operators \
                -o jsonpath='{.spec.clusterServiceVersionNames[*]}' 2>/dev/null || true)
              approved=$(oc get installplan "$ip" -n openshift-operators \
                -o jsonpath='{.spec.approved}' 2>/dev/null || true)
              if [[ "$names" == *openshift-pipelines-operator-rh* && "$approved" != true ]]; then
                echo "Approving InstallPlan ${ip} (${names})"
                oc patch installplan "$ip" -n openshift-operators --type merge -p '{"spec":{"approved":true}}' || true
              fi
            done < <(oc get installplan -n openshift-operators --no-headers 2>/dev/null | awk '{print $1}')
            echo "  operator CSV installed=${installed:-none} phase=${phase:-none}..."
            sleep 10
          done
          echo "ERROR: operator did not reach Succeeded on channel"
          oc get subscription,csv,installplan -n openshift-operators || true
          return 1
        }

        # Upgrade approval: OLM drives the version via the channel graph (startingCSV is
        # ignored on an existing subscription), so approve whatever InstallPlan the target
        # channel produces and wait until the installedCSV lands on the target minor
        # (any z-stream / build suffix), rather than a fixed CSV name.
        approve_upgrade_installplan() {
          local ver="$1"
          local target="${ver%.*}"
          local prefix="openshift-pipelines-operator-rh.v${target}."
          local deadline=$((SECONDS + 1800))
          local ip names approved installed phase
          echo "Waiting for operator to upgrade to ${target}.x (approving Manual InstallPlans)..."
          while (( SECONDS < deadline )); do
            installed=$(oc get subscription openshift-pipelines-operator-rh -n openshift-operators \
              -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
            if [[ "$installed" == "${prefix}"* ]]; then
              phase=$(oc get csv "$installed" -n openshift-operators -o jsonpath='{.status.phase}' 2>/dev/null || true)
              if [[ "$phase" == Succeeded ]]; then
                echo "Upgraded to ${installed} (phase=Succeeded)"
                return 0
              fi
            fi
            while IFS= read -r ip; do
              [[ -n "$ip" ]] || continue
              names=$(oc get installplan "$ip" -n openshift-operators \
                -o jsonpath='{.spec.clusterServiceVersionNames[*]}' 2>/dev/null || true)
              approved=$(oc get installplan "$ip" -n openshift-operators \
                -o jsonpath='{.spec.approved}' 2>/dev/null || true)
              if [[ "$names" == *openshift-pipelines-operator-rh* && "$approved" != true ]]; then
                echo "Approving InstallPlan ${ip} (${names})"
                oc patch installplan "$ip" -n openshift-operators --type merge -p '{"spec":{"approved":true}}' || true
              fi
            done < <(oc get installplan -n openshift-operators --no-headers 2>/dev/null | awk '{print $1}')
            echo "  operator installedCSV=${installed:-none} (want ${target}.x)..."
            sleep 10
          done
          echo "ERROR: operator did not upgrade to ${target}.x"
          oc get subscription,csv,installplan -n openshift-operators || true
          return 1
        }

        # Must not use `local ver=... csv="...${ver}"` — with set -u, ${ver} is unbound in the same local statement.
        approve_starting_csv_installplan() {
          local ver="$1"
          local csv="openshift-pipelines-operator-rh.v${ver}"
          local deadline=$((SECONDS + 900))
          local ip names phase approved
          echo "Waiting for CSV ${csv} (approving Manual InstallPlans)..."
          while (( SECONDS < deadline )); do
            phase=$(oc get csv "$csv" -n openshift-operators -o jsonpath='{.status.phase}' 2>/dev/null || true)
            if [[ "$phase" == Succeeded ]]; then
              echo "CSV ${csv} phase=Succeeded"
              return 0
            fi
            while IFS= read -r ip; do
              [[ -n "$ip" ]] || continue
              names=$(oc get installplan "$ip" -n openshift-operators \
                -o jsonpath='{.spec.clusterServiceVersionNames[*]}' 2>/dev/null || true)
              approved=$(oc get installplan "$ip" -n openshift-operators \
                -o jsonpath='{.spec.approved}' 2>/dev/null || true)
              if [[ "$names" == *"$csv"* && "$approved" != true ]]; then
                echo "Approving InstallPlan ${ip} for ${csv}"
                oc patch installplan "$ip" -n openshift-operators --type merge -p '{"spec":{"approved":true}}' || true
              fi
            done < <(oc get installplan -n openshift-operators --no-headers 2>/dev/null | awk '{print $1}')
            echo "  CSV ${csv} phase=${phase:-none}..."
            sleep 10
          done
          echo "ERROR: ${csv} did not reach Succeeded"
          oc get subscription,csv,installplan -n openshift-operators || true
          return 1
        }

        ensure_operator_csv() {
          local ver="$1"
          local mode="${2:-}"
          local csv="openshift-pipelines-operator-rh.v${ver}"
          local channel src
          channel="${CHANNEL}"
          src="$(params.CATALOG_SOURCE)"

          # Unpinned path — used for both:
          #  - pre-upgrade channel-head install (INSTALL_LATEST): latest z-stream from prod
          #  - upgrade to the next minor (mode=upgrade): OLM follows the channel graph
          # In both cases startingCSV must NOT be pinned (ignored on an existing
          # subscription); we approve whatever InstallPlan the target channel produces.
          if [[ "$mode" == upgrade || "${INSTALL_LATEST:-false}" == true ]]; then
            unpin_subscription_template
            echo "Ensuring latest operator on ${src}/${channel} (no startingCSV pin, Manual approval)"
            if oc get subscription openshift-pipelines-operator-rh -n openshift-operators &>/dev/null; then
              oc patch subscription openshift-pipelines-operator-rh -n openshift-operators --type json \
                -p '[{"op":"remove","path":"/spec/startingCSV"}]' 2>/dev/null || true
              oc patch subscription openshift-pipelines-operator-rh -n openshift-operators --type merge \
                -p "{\"spec\":{\"channel\":\"${channel}\",\"source\":\"${src}\",\"sourceNamespace\":\"openshift-marketplace\",\"installPlanApproval\":\"Manual\"}}"
            else
              printf '%s\n' \
                'apiVersion: operators.coreos.com/v1alpha1' \
                'kind: Subscription' \
                'metadata:' \
                '  name: openshift-pipelines-operator-rh' \
                '  namespace: openshift-operators' \
                'spec:' \
                "  channel: ${channel}" \
                '  installPlanApproval: Manual' \
                '  name: openshift-pipelines-operator-rh' \
                "  source: ${src}" \
                '  sourceNamespace: openshift-marketplace' \
              | oc apply -f -
            fi
            if [[ "$mode" == upgrade ]]; then
              approve_upgrade_installplan "$ver"
            else
              approve_latest_installplan
            fi
            return
          fi

          pin_subscription_template "$ver"
          echo "Ensuring operator ${csv} on ${src}/${channel} (Manual approval)"
          if oc get subscription openshift-pipelines-operator-rh -n openshift-operators &>/dev/null; then
            oc patch subscription openshift-pipelines-operator-rh -n openshift-operators --type merge \
              -p "{\"spec\":{\"channel\":\"${channel}\",\"source\":\"${src}\",\"sourceNamespace\":\"openshift-marketplace\",\"installPlanApproval\":\"Manual\",\"startingCSV\":\"${csv}\"}}"
          else
            printf '%s\n' \
              'apiVersion: operators.coreos.com/v1alpha1' \
              'kind: Subscription' \
              'metadata:' \
              '  name: openshift-pipelines-operator-rh' \
              '  namespace: openshift-operators' \
              'spec:' \
              "  channel: ${channel}" \
              '  installPlanApproval: Manual' \
              "  startingCSV: ${csv}" \
              '  name: openshift-pipelines-operator-rh' \
              "  source: ${src}" \
              '  sourceNamespace: openshift-marketplace' \
            | oc apply -f -
          fi
          approve_starting_csv_installplan "$ver"
        }

        run_gauge() {
          local tags="$1" target="$(params.SPECS)"
          [[ -f manifest.json ]] || { echo "ERROR: manifest.json missing in $(pwd)"; ls -la; exit 1; }
          [[ -e "$target" ]] || { echo "ERROR: gauge spec path missing: ${target}"; ls -la specs/ 2>/dev/null || true; exit 1; }
          local log="${report_path}/gauge.log"
          export GOFLAGS="${GOFLAGS:-} -vet=off"
          if [[ "$tags" == install || "$tags" == uninstall || "$tags" == upgrade ]]; then
            if [[ "$tags" == install && "${INSTALL_LATEST:-false}" == true ]]; then
              unpin_subscription_template
            elif [[ "$tags" == install || "$tags" == upgrade ]]; then
              pin_subscription_template "${OSP_VER}"
            fi
            gauge_reports_dir="${report_path}" logs_directory="${report_path}" \
              CATALOG_SOURCE="$(params.CATALOG_SOURCE)" CHANNEL="${CHANNEL}" \
              IS_DISCONNECTED="$(params.IS_DISCONNECTED)" \
              gauge run --tags="${tags}" --log-level=debug --verbose "${target}" 2>&1 | tee "$log"
            wait || true
          else
            local jitter=$((RANDOM % 120))
            sleep "$jitter"
            ARCH="$(params.ARCH)" gauge_reports_dir="${report_path}" logs_directory="${report_path}" \
              # gauge run --tags="${tags}" --max-retries-count=3 --retry-only "${tags}" \
              gauge run --tags="${tags}" \
              --log-level=debug --verbose "${target}" 2>&1 | tee "$log"
          fi
          if grep -q "No specifications found" "$log"; then
            echo "ERROR: no gauge specs matched tags=${tags} target=${target}"
            exit 1
          fi
        }

        run_ginkgo() {
          local tags="$1" path filter timeout="${GINKGO_TIMEOUT:-4h}"
          local log="${report_path}/ginkgo.log"
          path=$(ginkgo_test_path)
          filter=$(ginkgo_label_filter "$tags")
          prepare_ginkgo_ecosystem_s2i "$(params.SPECS)"
          case "$tags" in
            install|uninstall|upgrade)
              path=tests/olm/
              export CATALOG_SOURCE="$(params.CATALOG_SOURCE)" CHANNEL="${CHANNEL}"
              if [[ "$tags" == install && "${INSTALL_LATEST:-false}" == true ]]; then
                unpin_subscription_template
              elif [[ "$tags" == install || "$tags" == upgrade ]]; then
                pin_subscription_template "${OSP_VER}"
              fi
              ;;
          esac
          find tests -name '*.test' -delete 2>/dev/null || true
          export GOTMPDIR="${report_path}/gotmp"
          mkdir -p "$GOTMPDIR"
          export ARCH="$(params.ARCH)"

          # runtime.Caller in config.go returns relative path "workspace/release-tests-ginkgo-git/..."
          # which gets joined with CWD, doubling the path. Create a symlink so the doubled path resolves.
          if [[ "$(pwd)" == */workspace/* ]] && [[ ! -e "$(pwd)/workspace" ]]; then
            ln -sf /workspace "$(pwd)/workspace"
          fi

          echo "ginkgo run --label-filter='${filter}' ${path} (ARCH=${ARCH})"
          CI=true ARTIFACTS_DIR="${report_path}" GINKGO_PARALLEL=1 \
            ginkgo run \
            --procs=1 \
            --label-filter="$filter" --timeout="$timeout" --junit-report=junit-report.xml \
            --output-dir="${report_path}" --randomize-all -v "$path" 2>&1 | tee "$log"
          wait || true
        }

        save_results() {
          echo "Result: ${taskRunName}=${status}"
          echo "${taskRunName}: ${status}" > "$(workspaces.results.path)/${taskRunName}.result"
          case "$FRAMEWORK" in
            gauge)
              [[ -f "${report_path}/xml-report/result.xml" ]] && \
                cp "${report_path}/xml-report/result.xml" "$(workspaces.results.path)/${taskRunName}.xml"
              [[ -f "${report_path}/gauge.log" ]] && \
                cp "${report_path}/gauge.log" "$(workspaces.results.path)/${taskRunName}.log"
              ;;
            ginkgo)
              [[ -f "${report_path}/junit-report.xml" ]] && \
                cp "${report_path}/junit-report.xml" "$(workspaces.results.path)/${taskRunName}.xml"
              [[ -f "${report_path}/ginkgo.log" ]] && \
                cp "${report_path}/ginkgo.log" "$(workspaces.results.path)/${taskRunName}.log"
              local glog
              for glog in "${report_path}"/*.log "${report_path}"/ginkgo*.out; do
                [[ -f "$glog" ]] || continue
                [[ "$(basename "$glog")" == "ginkgo.log" ]] && continue
                cp "$glog" "$(workspaces.results.path)/${taskRunName}-$(basename "$glog")"
              done
              ;;
          esac
        }

        check_pac_secrets() {
          local spec="$(params.SPECS)" tags="$(params.TAGS)" missing=() v
          [[ "$spec" == *pac* ]] || return 0
          if [[ "$tags" == *pac-github* || "$spec" == *pac-github* ]]; then
            for v in PAC_GITHUB_TOKEN PAC_GITHUB_ORG; do [[ -n "${!v:-}" ]] || missing+=("$v"); done
          elif [[ "$tags" == *pac-gitlab* || "$spec" == *pac-gitlab* ]]; then
            for v in GITLAB_TOKEN GITLAB_GROUP_NAMESPACE GITLAB_PROJECT_ID GITLAB_WEBHOOK_TOKEN; do
              [[ -n "${!v:-}" ]] || missing+=("$v")
            done
          else
            for v in PAC_GITHUB_TOKEN PAC_GITHUB_ORG GITLAB_TOKEN GITLAB_GROUP_NAMESPACE GITLAB_PROJECT_ID GITLAB_WEBHOOK_TOKEN; do
              [[ -n "${!v:-}" ]] || missing+=("$v")
            done
          fi
          [[ ${#missing[@]} -eq 0 ]] || {
            echo "ERROR: PAC tests require ./scripts/hack/create-secrets.sh (CRED_SOURCE=local or vault)"
            echo "  Missing: ${missing[*]}"
            exit 1
          }
          echo "PAC credentials OK (${spec}, tags=${tags})"
        }

        # --- config ---
        FRAMEWORK="$(params.TEST_FRAMEWORK)"; FRAMEWORK="${FRAMEWORK,,}"
        case "$FRAMEWORK" in gauge|ginkgo) ;; *) echo "ERROR: TEST_FRAMEWORK must be gauge or ginkgo"; exit 1 ;; esac

        if [[ "$FRAMEWORK" == ginkgo ]]; then
          cd "$(workspaces.release-tests-ginkgo-git.path)"
        else
          cd "$(workspaces.release-tests-git.path)"
        fi
        echo "Working directory: $(pwd)"
        [[ -f go.mod ]] || { echo "ERROR: release-tests repo not ready (missing go.mod)"; ls -la; exit 1; }

        OSP_VER="$(params.OSP_VERSION)"
        [[ -n "$OSP_VER" ]] || { echo "ERROR: OSP_VERSION required"; exit 1; }
        # OSP_VERSION=latest (pre-upgrade) → install the head of CHANNEL (latest
        # z-stream, no startingCSV pin) instead of pinning an exact version.
        INSTALL_LATEST=false
        [[ "${OSP_VER,,}" == latest ]] && INSTALL_LATEST=true

        # Resolve the OLM channel once for both the subscription (ensure_operator_csv)
        # and the gauge/ginkgo install specs. If CHANNEL is empty, derive
        # pipelines-<major.minor> from CHANNEL_VERSION (e.g. pre-upgrade passes the
        # requested version while OSP_VERSION=latest), falling back to OSP_VERSION when
        # it is a concrete x.y.z (e.g. the upgrade step).
        CHANNEL="$(params.CHANNEL)"
        if [[ -z "$CHANNEL" ]]; then
          chver="$(params.CHANNEL_VERSION)"
          [[ -z "$chver" ]] && chver="$OSP_VER"
          if [[ "$chver" =~ ^[0-9]+\.[0-9]+ ]]; then
            CHANNEL="pipelines-${chver%.*}"
            echo "Derived OLM channel ${CHANNEL} from version ${chver}"
          else
            echo "WARN: CHANNEL empty and no concrete version to derive it from (CHANNEL_VERSION='$(params.CHANNEL_VERSION)', OSP_VERSION='${OSP_VER}')"
          fi
        fi
        export CHANNEL
        CLI_ARCH=$(pod_arch)

        if [[ "$FRAMEWORK" == ginkgo ]]; then
          GIT_BRANCH="$(params.GIT_RELEASE_TESTS_GINKGO_BRANCH)"
        else
          GIT_BRANCH="$(params.GIT_RELEASE_TESTS_BRANCH)"
        fi
        GIT_BRANCH="${GIT_BRANCH:-main}"

        GOMODCACHE_ROOT="$(workspaces.gomod-cache.path)"

        status=fail
        taskRunName="${TASKRUN_NAME}"
        report_path=$(mktemp -d)

        echo "Framework: ${FRAMEWORK}  GOMOD cache root: ${GOMODCACHE_ROOT}"
        [[ -f go.mod ]] || { echo "ERROR: go.mod missing in $(pwd)"; ls -la; exit 1; }
        use_gomod_cache
        prepare_toolchain
        echo "Toolchain ready (oc ephemeral; go modules + gauge/ginkgo from shared PVC cache)"
        tags="$(params.TAGS)"
        if [[ "$tags" == upgrade || "$tags" == post-upgrade ]]; then
          require_tools skip-cli
        else
          require_tools
          echo "Tools verified"
        fi

        taskRunName=$(oc get taskrun "${TASKRUN_NAME}" -n "${TASKRUN_NAMESPACE}" \
          -o json 2>/dev/null | jq -r '.metadata.labels["tekton.dev/pipelineTask"] // empty' || true)
        [[ -n "$taskRunName" ]] || taskRunName="${TASKRUN_NAME}"
        echo "Resolved pipelineTask name: ${taskRunName}"
        trap 'save_results' EXIT

        export ADMIN_NAME=${ADMIN_NAME:-kubeadmin} USER_PASSWORD=${USER_PASSWORD:-user}
        export KUBECONFIG=$HOME/.kube/config OSP_VERSION="${OSP_VER}"
        export CHAINS_REPOSITORY="$(params.CHAINS_REPOSITORY)" JIB_MAVEN_REPOSITORY="$(params.JIB_MAVEN_REPOSITORY)"
        export OPERATOR_ENVIRONMENT="$(params.OPERATOR_ENVIRONMENT)"

        check_pac_secrets

        echo "Logging in to cluster $(params.CLUSTER_NAME) as $(params.RUN_AS)"
        login_cluster "$(params.RUN_AS)"
        cleanup_stale_s2i_namespaces "$(params.SPECS)"

        # Clean stale upgrade test namespaces only before pre-upgrade (not post-upgrade, which needs them)
        tags="$(params.TAGS)"
        if [[ "$tags" == *pre-upgrade* && "$tags" != *post-upgrade* ]]; then
          stale=$(oc get projects -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
            | grep -E '^releasetest-upgrade-' || true)
          if [[ -n "$stale" ]]; then
            echo "Cleaning stale releasetest-upgrade-* namespaces from prior runs"
            while IFS= read -r ns; do
              [[ -n "$ns" ]] || continue
              oc delete project "$ns" --wait=false >/dev/null 2>&1 || true
            done <<< "$stale"
          fi
        fi

        tags="$(params.TAGS)"
        # Install/upgrade: wait for target CSV (Manual InstallPlan) before tests or tkn/opc download.
        if [[ "$tags" == install ]]; then
          ensure_operator_csv "${OSP_VER}"
        elif [[ "$tags" == upgrade ]]; then
          ensure_operator_csv "${OSP_VER}" upgrade
        fi
        # Channel-head installs (pre-upgrade) and upgrades resolve to whatever z-stream
        # OLM picks — reconcile OSP_VERSION to the actually installed CSV so version
        # assertions match reality instead of the requested (possibly older) pin.
        if [[ ( "$tags" == install && "${INSTALL_LATEST:-false}" == true ) || "$tags" == upgrade || "$tags" == *pre-upgrade* ]]; then
          actual=$(resolve_installed_osp_version || true)
          if [[ -n "$actual" ]]; then
            [[ "$actual" != "$OSP_VER" ]] && echo "Reconciling OSP_VERSION: requested=${OSP_VER} installed=${actual}"
            OSP_VER="$actual"
            export OSP_VERSION="$OSP_VER"
          else
            echo "WARN: could not resolve installed CSV version; keeping OSP_VERSION=${OSP_VER}"
          fi
        fi
        if [[ "$tags" == upgrade ]]; then
          # Operator is now at UPGRADE_VERSION. Pull the upgraded opc/tkn and refresh
          # the shared PVC cache so this task AND all consecutive tasks (e2e, versions,
          # pipelines, ...) validate with the upgraded CLI, not the cached pre-upgrade one.
          refresh_cli_from_upgraded_cluster "${OSP_VER}"
          require_tools
          echo "Tools verified"
          echo "  tkn: $(command -v tkn)  opc: $(command -v opc)"
        elif [[ "$tags" == post-upgrade ]]; then
          want="${OSP_VER%.*}"
          served=$(opc version 2>/dev/null | sed -n 's/.*Client:[[:space:]]*//p' | head -1)
          if [[ "$served" == "${want}."* || "$served" == "$want" ]]; then
            echo "Reusing upgraded opc ${served} from shared cache after operator ${OSP_VER}"
          else
            echo "Cached opc is ${served:-missing} (want ${want}.x); downloading tkn/opc from cluster"
            rm -f "/tmp/tkn-linux-${CLI_ARCH}.tar.gz"
            install_tkn
            hash -r 2>/dev/null || true
          fi
          require_tools
          echo "Tools verified"
          echo "  tkn: $(command -v tkn)  opc: $(command -v opc)"
        fi

        case "$FRAMEWORK" in
          gauge)  run_gauge "$tags" ;;
          ginkgo) run_ginkgo "$tags" ;;
        esac
        status=pass
