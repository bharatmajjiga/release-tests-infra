apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: acceptance-tests
spec:
  params:
  - name: ARCH
    description: cluster architecture
    default: "linux/amd64"
  - name: CATALOG_SOURCE
    description: provide catalog-source name through which user have to subscribe operator
    default: custom-operators
  - name: CLUSTER_NAME
    description: Cluster name (must match the secret suffix, e.g. aws-421-arm-5node-84f4l)
  - name: GIT_INFRA_URI
    default: https://github.com/openshift-pipelines/release-tests-infra.git
  - name: GIT_INFRA_BRANCH
    default: main
  - name: GIT_RELEASE_TESTS_URI
    default: https://github.com/openshift-pipelines/release-tests.git
  - name: GIT_RELEASE_TESTS_BRANCH
    description: release-tests branch matching the operator version (e.g. release-v1.22)
    default: ""
  - name: IMAGE
    description: Container image for running tests
    default: registry.access.redhat.com/ubi9/go-toolset:latest
  - name: INSTALL_PIPELINES_OPERATOR
    description: Install the Openshift Pipelines operator
    default: "true"
  - name: KONFLUX_INDEX_IMAGE
    description: Konflux index image URL
    default: ""
  - name: OPERATOR_ENVIRONMENT
    description: p12n operator environment (prod, stage, pre-stage)
    default: pre-stage
  - name: OPERATOR_VERSION
    description: version of Openshift Pipelines operator (x.y.z)
    default: ""
  - name: TAGS
    description: gauge tags for test suites
    default: "e2e"
  - name: TEST_SUITES
    type: array
    description: list of test suites to run
    default: []
  - name: UNINSTALL_PIPELINES_OPERATOR
    default: "false"
    description: Uninstall the operator after tests pass
  workspaces:
  - name: git

  tasks:
  # --- Clone repos ---
  - name: clone-infra-git
    params:
      - name: URL
        value: $(params.GIT_INFRA_URI)
      - name: DELETE_EXISTING
        value: "true"
      - name: REVISION
        value: $(params.GIT_INFRA_BRANCH)
    taskRef:
      resolver: cluster
      params:
      - name: kind
        value: task
      - name: name
        value: git-clone
      - name: namespace
        value: openshift-pipelines
    timeout: 10m
    workspaces:
    - name: output
      workspace: git
      subPath: infra-git

  - name: clone-release-tests-git
    params:
      - name: URL
        value: $(params.GIT_RELEASE_TESTS_URI)
      - name: DELETE_EXISTING
        value: "true"
      - name: REVISION
        value: $(params.GIT_RELEASE_TESTS_BRANCH)
    taskRef:
      resolver: cluster
      params:
      - name: kind
        value: task
      - name: name
        value: git-clone
      - name: namespace
        value: openshift-pipelines
    timeout: 10m
    workspaces:
    - name: output
      workspace: git
      subPath: release-tests-git

  # --- Setup ---
  - name: setup-testing-accounts
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
    runAfter:
      - clone-infra-git
    taskRef:
      name: setup-testing-accounts
    workspaces:
    - name: infra-git
      workspace: git
      subPath: infra-git

  - name: generate-build-artifacts
    params:
      - name: CATALOG_SOURCE
        value: $(params.CATALOG_SOURCE)
      - name: KONFLUX_INDEX_IMAGE
        value: $(params.KONFLUX_INDEX_IMAGE)
    runAfter:
      - clone-infra-git
    taskRef:
      name: generate-build-artifacts
    workspaces:
      - name: build-artifacts
        workspace: git
        subPath: build-artifacts

  - name: configure-operator
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: CATALOG_SOURCE
        value: $(params.CATALOG_SOURCE)
      - name: OPERATOR_ENVIRONMENT
        value: $(params.OPERATOR_ENVIRONMENT)
    taskRef:
      name: configure-operator
    runAfter:
      - generate-build-artifacts
      - setup-testing-accounts
    when:
      - input: $(params.OPERATOR_ENVIRONMENT)
        operator: notin
        values: ["prod"]
      - input: $(params.INSTALL_PIPELINES_OPERATOR)
        operator: in
        values: ["true", "True"]
    workspaces:
      - name: build-artifacts
        workspace: git
        subPath: build-artifacts

  # --- Install operator ---
  - name: install-pipelines-operator
    params:
      - name: CATALOG_SOURCE
        value: $(params.CATALOG_SOURCE)
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: FAIL_ON_ERROR
        value: "True"
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/olm.spec"
      - name: TAGS
        value: "install"
    runAfter:
      - configure-operator
      - clone-release-tests-git
    taskRef:
      name: release-tests
    timeout: 30m
    when:
      - input: $(params.INSTALL_PIPELINES_OPERATOR)
        operator: in
        values: ["true", "True"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  # ============================================================
  # Test suites — each gated by TEST_SUITES array param
  # All run after install-pipelines-operator
  # ============================================================

  - name: release-tests-versions
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/versions.spec"
      - name: TAGS
        value: $(params.TAGS)
      - name: OSP_VERSION
        value: $(params.OPERATOR_VERSION)
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 20m
    when:
      - input: release-tests-versions
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-pipelines
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "non-admin"
      - name: SPECS
        value: "specs/pipelines/"
      - name: TAGS
        value: $(params.TAGS)
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 30m
    when:
      - input: release-tests-pipelines
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-triggers
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "non-admin"
      - name: SPECS
        value: "specs/triggers/"
      - name: TAGS
        value: "$(params.TAGS) & !tls"
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 30m
    when:
      - input: release-tests-triggers
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-triggers-tls
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/triggers/eventlistener.spec"
      - name: TAGS
        value: "tls & $(params.TAGS)"
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 20m
    when:
      - input: release-tests-triggers-tls
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-chains
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/chains/"
      - name: TAGS
        value: $(params.TAGS)
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 30m
    when:
      - input: release-tests-chains
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-pac
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/pac/"
      - name: TAGS
        value: $(params.TAGS)
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 30m
    when:
      - input: release-tests-pac
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-results
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "non-admin"
      - name: SPECS
        value: "specs/results/"
      - name: TAGS
        value: $(params.TAGS)
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 30m
    when:
      - input: release-tests-results
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-metrics
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/metrics/"
      - name: TAGS
        value: $(params.TAGS)
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 20m
    when:
      - input: release-tests-metrics
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-rbac
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/operator/rbac.spec"
      - name: TAGS
        value: $(params.TAGS)
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 20m
    when:
      - input: release-tests-rbac
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-addon
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/operator/addon.spec"
      - name: TAGS
        value: $(params.TAGS)
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 20m
    when:
      - input: release-tests-addon
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-auto-prune
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/operator/auto-prune.spec"
      - name: TAGS
        value: $(params.TAGS)
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 20m
    when:
      - input: release-tests-auto-prune
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-manual-approval
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/manualapprovalgate/"
      - name: TAGS
        value: $(params.TAGS)
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 20m
    when:
      - input: release-tests-manual-approval
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-ecosystem
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/ecosystem/ecosystem.spec"
      - name: TAGS
        value: $(params.TAGS)
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 30m
    when:
      - input: release-tests-ecosystem
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-ecosystem-multiarch
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "admin"
      - name: SPECS
        value: "specs/ecosystem/ecosystem-multiarch.spec"
      - name: TAGS
        value: "$(params.ARCH) & $(params.TAGS)"
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 30m
    when:
      - input: release-tests-ecosystem-multiarch
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  - name: release-tests-ecosystem-s2i
    params:
      - name: CLUSTER_NAME
        value: $(params.CLUSTER_NAME)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: RUN_AS
        value: "non-admin"
      - name: SPECS
        value: "specs/ecosystem/ecosystem-s2i.spec"
      - name: TAGS
        value: "$(params.TAGS) & !skip_$(params.ARCH)"
    runAfter: [install-pipelines-operator]
    taskRef:
      name: release-tests
    timeout: 30m
    when:
      - input: release-tests-ecosystem-s2i
        operator: in
        values: ["$(params.TEST_SUITES[*])"]
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results

  # --- Uninstall operator (runs last) ---
  - name: uninstall-pipelines-operator
    onError: continue
    params:
    - name: CLUSTER_NAME
      value: $(params.CLUSTER_NAME)
    - name: FAIL_ON_ERROR
      value: "True"
    - name: IMAGE
      value: $(params.IMAGE)
    - name: RUN_AS
      value: "admin"
    - name: SPECS
      value: "specs/olm.spec"
    - name: TAGS
      value: "uninstall"
    runAfter:
      - install-pipelines-operator
      - release-tests-versions
      - release-tests-pipelines
      - release-tests-triggers
      - release-tests-triggers-tls
      - release-tests-chains
      - release-tests-pac
      - release-tests-results
      - release-tests-metrics
      - release-tests-rbac
      - release-tests-addon
      - release-tests-auto-prune
      - release-tests-manual-approval
      - release-tests-ecosystem
      - release-tests-ecosystem-multiarch
      - release-tests-ecosystem-s2i
    taskRef:
      name: release-tests
    timeout: 20m
    workspaces:
    - name: release-tests-git
      workspace: git
      subPath: release-tests-git
    - name: results
      workspace: git
      subPath: results
    when:
      - input: $(params.UNINSTALL_PIPELINES_OPERATOR)
        operator: in
        values: ["true", "True"]
