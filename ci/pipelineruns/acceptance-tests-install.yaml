# All values below should match env.template / .env
# Update .env first, then mirror values here for PipelineRun
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: acceptance-tests-
spec:
  pipelineRef:
    name: acceptance-tests
  params:
    - name: ARCH
      value: "linux/arm64"                    # env: ARCH
    - name: CATALOG_SOURCE
      value: redhat-operators                 # env: CATALOG_SOURCE
    - name: CLUSTER_NAME
      value: "openstack-xhbgw"                         # env: CLUSTER_NAME
    - name: GIT_RELEASE_TESTS_BRANCH
      value: "release-v1.22"                  # env: GIT_RELEASE_TESTS_BRANCH
    - name: IMAGE
      value: "registry.access.redhat.com/ubi9/go-toolset:latest"  # env: IMAGE
    - name: INSTALL_PIPELINES_OPERATOR
      value: "false"                           # env: INSTALL_PIPELINES_OPERATOR
    - name: KONFLUX_INDEX_IMAGE
      value: "quay.io/openshift-pipeline/pipelines-index-4.21:v1.20.5"  # env: KONFLUX_INDEX_IMAGE
    - name: OPERATOR_ENVIRONMENT
      value: prod                             # env: OPERATOR_ENVIRONMENT
    - name: OPERATOR_VERSION
      value: "1.22.0"                         # env: OPERATOR_VERSION
    - name: GIT_INFRA_BRANCH
      value: "acceptance-tests-infra"         # env: GIT_INFRA_BRANCH
    - name: TAGS
      value: "e2e"                            # env: TAGS
    - name: TEST_SUITES
      value:
        - release-tests-versions              # env: TEST_SUITES
    - name: UNINSTALL_PIPELINES_OPERATOR
      value: "false"                          # env: UNINSTALL_PIPELINES_OPERATOR
  timeouts:
    pipeline: 1h
  workspaces:
    - name: git
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 200Mi
