apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: upload-artifacts-gcs-test-
spec:
  pipelineSpec:
    workspaces:
      - name: data
    tasks:
      - name: generate-sample-results
        workspaces:
          - name: results
            workspace: data
        taskSpec:
          workspaces:
            - name: results
          steps:
            - name: create-sample-artifacts
              image: quay.io/openshift-pipeline/ci:latest
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                RESULTS="$(workspaces.results.path)"

                echo "Generating sample test artifacts..."

                echo "release-tests-pipelines: pass" > "${RESULTS}/release-tests-pipelines.result"
                echo "release-tests-triggers: pass" > "${RESULTS}/release-tests-triggers.result"
                echo "release-tests-chains: fail" > "${RESULTS}/release-tests-chains.result"

                cat > "${RESULTS}/release-tests-pipelines.xml" <<'XML'
                <?xml version="1.0" encoding="UTF-8"?>
                <testsuites tests="5" failures="0" time="120.5">
                  <testsuite name="pipelines" tests="5" failures="0">
                    <testcase name="create-pipeline" time="10.2"/>
                    <testcase name="run-pipeline" time="45.3"/>
                    <testcase name="pipeline-results" time="8.1"/>
                    <testcase name="pipeline-finally" time="12.7"/>
                    <testcase name="pipeline-workspaces" time="44.2"/>
                  </testsuite>
                </testsuites>
                XML

                cat > "${RESULTS}/release-tests-chains.xml" <<'XML'
                <?xml version="1.0" encoding="UTF-8"?>
                <testsuites tests="3" failures="1" time="90.0">
                  <testsuite name="chains" tests="3" failures="1">
                    <testcase name="chains-signing" time="30.0"/>
                    <testcase name="chains-provenance" time="25.0">
                      <failure message="timeout waiting for provenance">Expected provenance within 60s</failure>
                    </testcase>
                    <testcase name="chains-transparency" time="35.0"/>
                  </testsuite>
                </testsuites>
                XML

                echo "[INFO] Test run started at $(date -u '+%Y-%m-%d %H:%M UTC')" > "${RESULTS}/release-tests-pipelines.log"
                echo "[INFO] All 5 specs passed" >> "${RESULTS}/release-tests-pipelines.log"
                echo "[INFO] Test run started at $(date -u '+%Y-%m-%d %H:%M UTC')" > "${RESULTS}/release-tests-chains.log"
                echo "[ERROR] chains-provenance: timeout waiting for provenance" >> "${RESULTS}/release-tests-chains.log"

                echo "Sample artifacts created:"
                ls -la "${RESULTS}/"
    finally:
      - name: upload-artifacts-gcs
        params:
          - name: PIPELINE_RUN_NAME
            value: $(context.pipelineRun.name)
          - name: OPERATOR_VERSION
            value: "test-sample"
        taskRef:
          name: upload-artifacts-gcs
        workspaces:
          - name: results
            workspace: data
  timeouts:
    pipeline: 10m
  workspaces:
    - name: data
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Mi
