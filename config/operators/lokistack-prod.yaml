apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: logging-loki
  namespace: openshift-logging
spec:
  managementState: Managed
  replication:
    factor: 1
  size: 1x.demo
  storage:
    schemas:
      - effectiveDate: "2023-10-15"
        version: v13
    secret:
      name: logging-loki-minio
      type: s3
  storageClassName: REPLACE_ME
  template:
    distributor:
      replicas: 2
    gateway:
      replicas: 2
    indexGateway:
      replicas: 2
    ingester:
      replicas: 2
    querier:
      replicas: 2
    queryFrontend:
      replicas: 2
  tenants:
    mode: openshift-logging
