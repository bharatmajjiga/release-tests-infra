apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
  - name: SSO
    mappingMethod: add
    type: OpenID
    openID:
      clientID: cicd.ospqa.com
      clientSecret:
        name: redhat-sso
      claims:
        preferredUsername:
        - preferred_username
        name:
        - name
        email:
        - email
      issuer: https://auth.redhat.com/auth/realms/EmployeeIDP
  tokenConfig:
    accessTokenMaxAgeSeconds: 8640000

